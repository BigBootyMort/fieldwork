[pytest]
testpaths = tests
# Default run is the fast, deterministic smoke set. Opt into the rest explicitly:
#   pytest                 → fast smoke (skips slow/llm)
#   pytest -m slow         → LLM-backed / heavy endpoints
#   pytest -m ""           → everything
addopts = -ra -m "not slow"
markers =
    slow: hits an LLM or a heavy/long endpoint (news brief, orchestrate) — excluded by default
    network: depends on a third-party API (Yahoo, ipinfo) — may skip if the upstream is down
