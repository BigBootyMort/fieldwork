server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Never cache index.html — always serve fresh so JS/CSS changes are immediate
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri =404;
    }

    # Static assets (images, fonts, etc.) — cache for 1 hour
    location /static/ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # Fallback for SPA: any unknown path returns index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
