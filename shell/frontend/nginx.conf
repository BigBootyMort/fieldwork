# Shell frontend — serves the Runi SPA and proxies ALL /api/ calls to
# the shell backend.  Adding a new module never requires touching this file —
# just register the backend routes under /api/<module_id>/.
#
# The Fieldwork iframe (port 3000) calls its own backend directly, so there
# is no /api/fieldwork/ conflict here.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Prevent JS/CSS/HTML from being stale-cached in dev.
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    add_header Expires "0";

    # SPA fallback — every path that isn't a real file returns index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # All shell + module API calls route to the single shell backend.
    # LLM-backed endpoints (brief, report generation, ask) can take 2+ min —
    # generous timeouts cover even the slowest local model.
    location /api/ {
        # Re-resolve the backend on every request via Docker's embedded DNS
        # (127.0.0.11). Without this, nginx resolves shell-backend once at
        # startup and caches the IP — so a rebuild that recreates the backend
        # container (new IP) leaves nginx proxying to a dead address (502).
        # A variable in proxy_pass forces per-request resolution.
        resolver           127.0.0.11 valid=10s ipv6=off;
        set                $shell_backend shell-backend;
        proxy_pass         http://$shell_backend:8002;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
