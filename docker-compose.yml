name: fieldwork

services:
  neo4j:
    image: neo4j:5-community
    container_name: fieldwork-neo4j
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-changeme_dev_only}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_dbms_security_auth__minimum__password__length: 4
      # Bounded JVM heap + page cache so Neo4j stays predictable on a
      # resource-constrained Docker Desktop (prevents runaway memory).
      NEO4J_server_memory_heap_initial__size: ${NEO4J_HEAP:-512m}
      NEO4J_server_memory_heap_max__size:     ${NEO4J_HEAP:-512m}
      NEO4J_server_memory_pagecache_size:     ${NEO4J_PAGECACHE:-512m}
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p ${NEO4J_PASSWORD:-changeme_dev_only} 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  neo4j-init:
    image: neo4j:5-community
    container_name: fieldwork-neo4j-init
    depends_on:
      neo4j:
        condition: service_healthy
    volumes:
      - ./neo4j/init.cypher:/init.cypher:ro
    entrypoint: ["bash", "-c"]
    command: >
      "cypher-shell -a bolt://neo4j:7687 -u neo4j -p ${NEO4J_PASSWORD:-changeme_dev_only} -f /init.cypher && echo 'Schema initialized'"
    restart: "no"

  backend:
    build: ./backend
    container_name: fieldwork-backend
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      NEO4J_URI:              bolt://neo4j:7687
      NEO4J_USER:             neo4j
      NEO4J_PASSWORD:         ${NEO4J_PASSWORD:-changeme_dev_only}
      # Phase 13 — set a stable secret so tokens survive restarts
      JWT_SECRET:             ${JWT_SECRET:-change_this_to_a_long_random_string}
      ACCESS_TOKEN_EXPIRE_HOURS: ${ACCESS_TOKEN_EXPIRE_HOURS:-8}
      # Single-user mode — every request is treated as 'owner' (admin).
      # Safe ONLY because the backend port is bound to 127.0.0.1 in compose.
      # Set AUTH_DISABLED=false to re-enable login.
      AUTH_DISABLED:          ${AUTH_DISABLED:-true}
      OPENCORPORATES_TOKEN:   ${OPENCORPORATES_TOKEN:-}
      GITHUB_TOKEN:           ${GITHUB_TOKEN:-}
      NEWS_API_KEY:           ${NEWS_API_KEY:-}
      SEC_USER_AGENT:         ${SEC_USER_AGENT:-Fieldwork OSINT research@fieldwork.local}
      SHODAN_API_KEY:         ${SHODAN_API_KEY:-}
      VIRUSTOTAL_API_KEY:     ${VIRUSTOTAL_API_KEY:-}
      ALEPH_API_KEY:          ${ALEPH_API_KEY:-}
      SAUCENAO_KEY:           ${SAUCENAO_KEY:-}
      WIGLE_API_KEY:          ${WIGLE_API_KEY:-}
      CENSYS_API_ID:          ${CENSYS_API_ID:-}
      CENSYS_API_SECRET:      ${CENSYS_API_SECRET:-}
      DEHASHED_EMAIL:         ${DEHASHED_EMAIL:-}
      DEHASHED_KEY:           ${DEHASHED_KEY:-}
      ABUSEIPDB_KEY:          ${ABUSEIPDB_KEY:-}
      NUMVERIFY_KEY:          ${NUMVERIFY_KEY:-}
      OLLAMA_EMBED_MODEL:     ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      SPIDERFOOT_URL:         http://spiderfoot:5001
      MAIGRET_URL:            http://maigret:7000
      HARVESTER_URL:          http://theharvester:7001
      RECON_URL:              http://recon:7002
      MAILACCESS_URL:         http://mailaccess:8000
      TORBOT_URL:             http://torbot:7003
      VOIDACCESS_URL:         http://voidaccess:7004
      LIBRETRANSLATE_URL:     http://libretranslate:5000
      # Phase 6 — new data sources
      OPENSKY_USERNAME:       ${OPENSKY_USERNAME:-}
      OPENSKY_PASSWORD:       ${OPENSKY_PASSWORD:-}
      HIBP_API_KEY:           ${HIBP_API_KEY:-}
      ARKHAM_API_KEY:         ${ARKHAM_API_KEY:-}
      # Phase 16 — Local LLM
      OLLAMA_URL:             http://ollama:11434
      OLLAMA_MODEL:           ${OLLAMA_MODEL:-llama3.2}
      # Claude (single source with the shell backend via .env). If blank here,
      # the legacy bridge still falls back to backend/app/runtime_api_keys.json.
      ANTHROPIC_API_KEY:      ${ANTHROPIC_API_KEY:-}
      # OmniRoute — optional OpenAI-compatible LLM gateway tier (below Claude, above Ollama).
      # Set BASE_URL to a hosted/self-run OmniRoute origin (incl. any /v1) + a MODEL id.
      OMNIROUTE_BASE_URL:     ${OMNIROUTE_BASE_URL:-}
      OMNIROUTE_API_KEY:      ${OMNIROUTE_API_KEY:-}
      OMNIROUTE_MODEL:        ${OMNIROUTE_MODEL:-}
    volumes:
      - ./backend/app:/app
    depends_on:
      neo4j:
        condition: service_healthy
    # Self-heal: if Neo4j (or Docker) blips, the backend restarts and
    # re-resolves the connection instead of staying down with a stale pool.
    restart: unless-stopped

  # Frontend — nginx serving the single-page OSINT dashboard.
  # Still accessible standalone at 127.0.0.1:3000 (used as iframe src by the shell).
  frontend:
    build: ./frontend
    container_name: fieldwork-frontend
    ports:
      - "127.0.0.1:3000:80"
    volumes:
      # Live-mount so frontend edits don't need a rebuild.
      - ./frontend/index.html:/usr/share/nginx/html/index.html:ro
      - ./frontend/static:/usr/share/nginx/html/static:ro
      # Custom nginx config — disables caching for index.html so JS changes
      # are always picked up without a hard refresh.
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    depends_on:
      - backend

  # ── Runi Shell ───────────────────────────────────────────────────────────
  # The shell chrome that hosts Fieldwork + future modules (News, Calendar, …).
  # Open http://localhost:3001 to use the unified dashboard.
  # http://localhost:3000 still works for direct Fieldwork-only access.
  shell-backend:
    build: ./shell/backend
    container_name: runi-shell-backend
    ports:
      - "127.0.0.1:8002:8002"
    environment:
      NEO4J_URI:        bolt://neo4j:7687
      NEO4J_USER:       neo4j
      NEO4J_PASSWORD:   ${NEO4J_PASSWORD:-changeme_dev_only}
      FIELDWORK_API:    http://backend:8000
      FIELDWORK_FRONT:  ${FIELDWORK_FRONT_URL:-http://localhost:3000}
      OLLAMA_URL:       http://ollama:11434
      OLLAMA_MODEL:     ${OLLAMA_MODEL:-llama3.2}
      # Claude for all shell modules (news brief, markets/reports analysis, agent,
      # gigs, presence). Without it the shell falls back to Ollama. The Agent ⚙
      # Settings UI (agent_config.json) also sets this and overrides env.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # ── Agent integrations (optional — can also be set via the ⚙ button in the UI) ──
      GITHUB_TOKEN:      ${GITHUB_TOKEN:-}
      ALPACA_API_KEY:    ${ALPACA_API_KEY:-}
      ALPACA_API_SECRET: ${ALPACA_API_SECRET:-}
      ALPACA_BASE_URL:   ${ALPACA_BASE_URL:-https://paper-api.alpaca.markets}
    volumes:
      # Live-mount source so backend edits don't need a rebuild
      # (matches the existing fieldwork-backend pattern).
      - ./shell/backend/app:/app
    depends_on:
      neo4j:
        condition: service_healthy
    restart: unless-stopped

  shell-frontend:
    build: ./shell/frontend
    container_name: runi-shell-frontend
    ports:
      - "127.0.0.1:3001:80"
    volumes:
      # Live-mount static assets so edits don't need a rebuild.
      - ./shell/frontend/index.html:/usr/share/nginx/html/index.html:ro
      - ./shell/frontend/shell.js:/usr/share/nginx/html/shell.js:ro
      - ./shell/frontend/style.css:/usr/share/nginx/html/style.css:ro
      - ./shell/frontend/modules:/usr/share/nginx/html/modules:ro
      # Live-mount nginx config — future routing changes only need a
      # container restart (no rebuild).
      - ./shell/frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    depends_on:
      - shell-backend

  # Maigret — username OSINT across 3000+ sites.
  # Not exposed publicly — only the backend reaches it.
  maigret:
    build:
      context: ./maigret
    container_name: fieldwork-maigret
    restart: unless-stopped

  # theHarvester — email + subdomain harvesting from open sources.
  # Not exposed publicly — only the backend reaches it.
  theharvester:
    build:
      context: ./theharvester
    container_name: fieldwork-theharvester
    restart: unless-stopped

  # MailAccess — email OSINT (2500+ platforms, breach detection, identity clustering).
  # Ships its own REST server (`mailaccess serve` on :8000); the backend drives it via
  # POST /api/investigate → poll GET /api/report/{id}. Not exposed publicly.
  # First build is heavy (pulls the OSINT engine deps); cached afterwards.
  mailaccess:
    build:
      context: ./mailaccess
    container_name: fieldwork-mailaccess
    restart: unless-stopped
    volumes:
      # Persist MailAccess's SQLite cache so finished investigations survive restarts.
      - mailaccess_data:/root

  # TorBot — dark-web .onion crawler. Bundles its own Tor daemon (SOCKS5 :9050) and a
  # thin FastAPI wrapper on :7003; the backend drives it via POST /search {url, depth}.
  # Not exposed publicly. First build clones TorBot + installs Tor (heavy; cached after).
  torbot:
    build:
      context: ./torbot
    container_name: fieldwork-torbot
    restart: unless-stopped
    volumes:
      # Live-mount the wrapper so tweaks need only a restart, not a rebuild (matches recon).
      - ./torbot/server.py:/srv/server.py:ro

  # VoidAccess — dark-web threat-intel platform, run in lightweight CLI mode (SQLite).
  # Bundles Tor + a thin FastAPI wrapper on :7004 that shells out to `voidaccess
  # investigate` → `voidaccess export --format json`. Heavy first build (torch+chromadb+
  # spaCy). Not exposed publicly. server.py live-mounted for fast wrapper iteration.
  voidaccess:
    build:
      context: ./voidaccess
    container_name: fieldwork-voidaccess
    restart: unless-stopped
    volumes:
      - ./voidaccess/server.py:/srv/server.py:ro
      - voidaccess_data:/data

  # Quant engine — NautilusTrader backtester for the Quant module (Track 4, rev B).
  # Replaces the earlier VibeTrading container (whose backtester booked 0 trades). Research
  # mode only: Nautilus BacktestEngine + SIM venue — no live venue/adapter/exchange key.
  # Claude fills a strategy scaffold; the wrapper owns the engine/data boilerplate.
  # Not exposed publicly. server.py + gate.py live-mounted for fast iteration.
  quant-engine:
    build:
      context: ./quant-engine
    container_name: fieldwork-quant-engine
    restart: unless-stopped
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Claude model litellm/generation uses; override if this account lacks it.
      QUANT_MODEL: ${QUANT_MODEL:-claude-haiku-4-5-20251001}
    volumes:
      - ./quant-engine/server.py:/srv/server.py:ro
      - ./quant-engine/gate.py:/srv/gate.py:ro
      - quant_engine_data:/data

  # SpiderFoot — OSINT automation framework.
  # Built from GitHub source (no PyPI/Docker Hub package exists).
  # SpiderFoot has NO built-in auth — bound to 127.0.0.1 only.
  spiderfoot:
    build:
      context: ./spiderfoot
    container_name: fieldwork-spiderfoot
    ports:
      - "127.0.0.1:5001:5001"
    volumes:
      - spiderfoot_data:/data
    restart: unless-stopped

  # ── Recon service — nmap, subfinder, nuclei, httpx wrapped as HTTP API ─────
  # Not exposed externally — only the backend calls it via http://recon:7002.
  # First build downloads Go tools + nuclei templates (~500 MB, cached after).
  recon:
    build:
      context: ./recon
    container_name: fieldwork-recon
    restart: unless-stopped
    volumes:
      # Live-mount app.py so fixes don't need a rebuild (matches backend pattern)
      - ./recon/app.py:/recon/app.py:ro

  # ── Phase 16: Ollama — local LLM inference ───────────────────────────────
  # Runs llama3.2 (3 B) by default. Change OLLAMA_MODEL in .env to swap.
  # GPU passthrough (optional — uncomment deploy block if you have an NVIDIA GPU):
  #
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: all
  #             capabilities: [gpu]
  #
  # First-run model pull happens via ollama-init below (~2 GB download).
  ollama:
    image: ollama/ollama
    container_name: fieldwork-ollama
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # Pulls the default model on first compose-up.
  # Re-runs on every compose-up but ollama pull is a no-op if the model
  # is already present, so it exits quickly on subsequent starts.
  ollama-init:
    image: ollama/ollama
    container_name: fieldwork-ollama-init
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST:  http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
    entrypoint: ["sh", "-c"]
    command: "ollama pull $OLLAMA_MODEL && echo \"Model $OLLAMA_MODEL ready\""
    restart: "no"

  # ── Optional: LibreTranslate (Phase 4.5) ─────────────────────────────────
  # Self-hosted translation engine. Only starts when you include the
  # "translation" profile:
  #
  #   docker compose --profile translation up -d
  #
  # First start downloads language models (~600 MB). Falls back gracefully
  # if not running — the backend simply skips translation.
  libretranslate:
    image: libretranslate/libretranslate:latest
    container_name: fieldwork-libretranslate
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      LT_LOAD_ONLY: "en,es,fr,de,it,pt,ru,ar,zh,ja,ko"
      LT_UPDATE_MODELS: "true"
    volumes:
      - libretranslate_models:/home/libretranslate/.local
    restart: unless-stopped
    profiles:
      - translation

  # ── Runi voice — local neural TTS (Piper). Models baked in → offline runtime.
  #    Reached by shell-backend at http://piper:5000; 5051 is a localhost audition port.
  piper:
    build: ./piper
    container_name: fieldwork-piper
    ports:
      - "127.0.0.1:5051:5000"
    environment:
      PIPER_VOICE: ${PIPER_VOICE:-en_GB-alba-medium}
    volumes:
      - ./piper/app.py:/app/app.py:ro   # live-mount so accent tuning needs only a restart
    restart: unless-stopped

  # ── Runi ears — local speech-to-text (faster-whisper). Model baked in → offline.
  #    Reached by shell-backend at http://whisper:5000.
  whisper:
    build: ./whisper
    container_name: fieldwork-whisper
    restart: unless-stopped   # model (base.en) is baked into the image

volumes:
  neo4j_data:
  neo4j_logs:
  spiderfoot_data:
  libretranslate_models:
  ollama_models:
  mailaccess_data:
  voidaccess_data:
  quant_engine_data:
